# =========================================================================
# "Cabina di regia" del traffico API: un solo upstream, usato da tutti e
# tre gli ambienti (PROD/TEST/SVI). Per spostare il traffico da BLUE a
# GREEN basta commentare/decommentare le due righe "server" sotto e fare
# un reload della configurazione (nessun downtime, nessun riavvio dei
# container backend).
# =========================================================================
upstream sio-backend-api {
    server sio-backend-blue:3000;   # <-- versione LIVE attuale (BLUE)
    # server sio-backend-green:3000;  # <-- decommentare questa e commentare/
                                       #     rimuovere quella sopra per
                                       #     spostare il traffico su GREEN
}

# AMBIENTE PROD
server{
    listen 80;
    server_name localhost;
    location / {
        proxy_pass http://fe-prod:80;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://sio-backend-api;
    }
}

# AMBIENTE TEST
server{
    listen 8080;
    location / {
        proxy_pass http://fe-test:80;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://sio-backend-api;
    }
}

# AMBIENTE SVI
server{
    listen 8999;
    location / {
        proxy_pass http://fe-sio:80;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://sio-backend-api;
    }
}