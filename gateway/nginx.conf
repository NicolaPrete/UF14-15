user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# =============================================================================
# BLOCCO HTTP — invariato: instrada PROD/TEST/SVI + /api/ verso i backend,
# vedi conf.d/*.conf (incluso più sotto).
# =============================================================================
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

# =============================================================================
# BLOCCO STREAM (Livello 4 - TCP) — Task 4: "Tunnel per il Database"
#
# Il database parla il protocollo binario Postgres, non HTTP: non può essere
# instradato con "location"/"proxy_pass" del blocco http (Livello 7), serve il
# modulo stream di nginx, che fa da semplice "passacarte" TCP: apre una
# connessione verso db:5432 per ogni connessione in ingresso sulla 5432 del
# Gateway, senza interpretare il contenuto dei pacchetti.
#
# Punto di ingresso unico: chi vuole collegare DBeaver/TablePlus punta il
# proprio client a  <indirizzo-del-gateway>:5432  esattamente come se fosse
# il database stesso — ma la porta reale del container "db" resta chiusa
# verso l'host (nessun "ports:" sul servizio db in docker-compose.yml).
# =============================================================================
stream {
    log_format  db_tunnel  '$remote_addr [$time_local] '
                            'bytes_in=$bytes_received bytes_out=$bytes_sent '
                            'session_time=$session_time status=$status';

    access_log  /var/log/nginx/db_tunnel_access.log  db_tunnel;
    error_log   /var/log/nginx/db_tunnel_error.log;

    server {
        listen 5432;
        proxy_pass db:5432;

        # Timeout di sicurezza: chiude connessioni "appese" (client disconnesso
        # a metà, tool di analisi lasciato aperto tutta la notte, ecc.)
        proxy_timeout 10m;
        proxy_connect_timeout 5s;
    }
}