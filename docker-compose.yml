#version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: sio-postgres
    environment:
      POSTGRES_USER: sio_user
      POSTGRES_PASSWORD: sio_password
      POSTGRES_DB: sio_db
    # NB: nessuna sezione "ports" -> il DB non è raggiungibile dall'host,
    # ma resta risolvibile via DNS interno SOLO dai container sulla backend-net.
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-net

  # --- BACKEND BLUE (versione attualmente "live") ---
  backend-blue:
    build: ./backend
    image: his-afp-backend:${BLUE_VERSION:-latest}
    container_name: sio-backend-blue
    #    ports:
    #      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: sio_user
      DB_PASS: sio_password
      DB_NAME: sio_db
      JWT_SECRET: "chiave_segreta_super_sicura_per_il_corso_segretissimissima"
      AUTH_ENABLED: "false"
      BACKEND_INSTANCE: "blue"
    depends_on:
      - db
    restart: always
    networks:
      - backend-net

  # --- BACKEND GREEN (nuova versione in affiancamento) ---
  backend-green:
    build: ./backend
    image: his-afp-backend:${GREEN_VERSION:-latest}
    container_name: sio-backend-green
    #    ports:
    #      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: sio_user
      DB_PASS: sio_password
      DB_NAME: sio_db
      JWT_SECRET: "chiave_segreta_super_sicura_per_il_corso_segretissimissima"
      AUTH_ENABLED: "false"
      BACKEND_INSTANCE: "green"
    depends_on:
      - db
    restart: always
    networks:
      - backend-net

  fe-sio:
    build:
      context: ./his-afp
      dockerfile: Dockerfile
    image: his-afp:${SVI_VERSION:-latest}
    container_name: sio-fe-sio
    environment:
      APP_ENV: "SVI"
      APP_VERSION: "${SVI_VERSION}"
    networks:
      - frontend-net

  # AMBIENTE PRODUZIONE (BLUE)
  fe-prod:
    build:
      context: ./his-afp
      dockerfile: Dockerfile
    image: his-afp:${PROD_VERSION:-latest}
    container_name: sio-fe-prod
    environment:
      APP_ENV: "PROD"
      APP_VERSION: "${PROD_VERSION}"
    networks:
      - frontend-net

  fe-test:
    build:
      context: ./his-afp
      dockerfile: Dockerfile
    image: his-afp:${TEST_VERSION:-latest}
    container_name: sio-fe-test
    environment:
      APP_ENV: "TEST"
      APP_VERSION: "${TEST_VERSION}"
    networks:
      - frontend-net

  gateway:
    image: nginx:alpine
    container_name: sio-gateway
    ports:
      - "80:80"
      - "8080:8080"
      - "8999:8999"
    volumes:
      - ./gateway:/etc/nginx/conf.d/:ro
    depends_on:
      - fe-sio
      - fe-prod
      - fe-test
      - backend-blue
      - backend-green
    restart: always
    networks:
      - frontend-net
      - backend-net

networks:
  frontend-net:
    driver: bridge
    name: his-afp_frontend-net
  backend-net:
    driver: bridge
    name: his-afp_backend-net
    internal: true   # ulteriore hardening: nessun accesso diretto a Internet dalla rete dati

volumes:
  pg_data: